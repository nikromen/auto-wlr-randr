# Example configuration for auto-wlr-randr.
#
# Copy to ~/.config/auto-wlr-randr/config.toml and edit the output patterns for your
# monitors. To find identifiers, run:
#   wlr-randr --json | jq '.[] | {name, make, model, serial}'
#
# Output patterns match against:
#   - connector name (e.g. "HDMI-A-1", "DP-2")
#   - make + model identifier (e.g. "Dell Inc. DELL U2718Q")
#   - make + model + serial (e.g. "Dell Inc. DELL U2718Q ABC123456")
#   - serial alone (e.g. "ABC123456")
#
# Glob patterns are supported (e.g. "HDMI-*", "Dell Inc. *", "*ABC*").
#
# A profile matches only when the number of connected outputs equals the number of
# settings entries and every pattern matches exactly one output. Profiles are tried in
# file order; the first match wins.
#
# Validate this file without starting the daemon:
#   auto-wlr-randrctl validate -c /usr/share/auto-wlr-randr/config.toml.example

# Optional: run when no profile matches (after a short delay)
# on_no_match_exec = ["notify-send 'auto-wlr-randr: no profile for current outputs'"]

# Laptop only (one built-in or single output)
[profile.laptop_only]

[[profile.laptop_only.settings]]
# Replace with your laptop panel pattern, e.g. "eDP-*" or "BOE 0xABC"
output = "EXAMPLE-LAPTOP-*"
on = true
preferred = true

# Dual monitor setup
[profile.dual_monitor]

exec = [
    "echo 'auto-wlr-randr: activated dual_monitor profile'",
]

[[profile.dual_monitor.settings]]
# Primary monitor — identifier with make and model:
output = "EXAMPLE-COMPANY MODEL-ONE *"
on = true
mode = "2560x1440"
pos = "0,0"
scale = 1.0

[[profile.dual_monitor.settings]]
# Secondary monitor — connector name (may change between reboots):
output = "EXAMPLE-HDMI-*"
on = true
mode = "1920x1080"
pos = "2560,0"

# Two identical monitors distinguished by serial number
[profile.dual_identical_monitors]

[[profile.dual_identical_monitors.settings]]
output = "EXAMPLE-SERIAL-111111"
on = true
mode = "2560x1440@60Hz"
pos = "0,0"

[[profile.dual_identical_monitors.settings]]
output = "EXAMPLE-SERIAL-222222"
on = true
mode = "2560x1440@60Hz"
pos = "2560,0"

# Profile with exec only (no wlr-randr settings) — patterns still must match all outputs
[profile.exec_only]

exec = ["echo 'hello from auto-wlr-randr'"]

[[profile.exec_only.settings]]
output = "EXAMPLE-DOCK-*"

[[profile.exec_only.settings]]
output = "EXAMPLE-PROJECTOR-*"
